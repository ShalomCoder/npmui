name: Build and publish release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.platform }} ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            runner: windows-latest
            arch: x64
            builder_args: "--win nsis --x64"
          - platform: linux
            runner: ubuntu-latest
            arch: x64
            builder_args: "--linux AppImage deb --x64"
          - platform: linux
            runner: ubuntu-latest
            arch: arm64
            builder_args: "--linux AppImage deb --arm64"

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build renderer and Electron code
        run: npm run build

      - name: Build installers
        shell: bash
        run: npx electron-builder ${{ matrix.builder_args }}

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: npmUI-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download installer artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish release and installers
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: npmUI ${{ github.ref_name }}
          generate_release_notes: true
          files: release-assets/*
